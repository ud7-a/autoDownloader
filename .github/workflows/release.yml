name: Release

on:
  # Path A -- one click: Actions > Release > Run workflow, type the version.
  # Bumps APP_VERSION, commits, tags, builds and publishes in a single run.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 4.2.3'
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

  # Path B -- push a tag by hand (git tag v4.2.3 && git push origin v4.2.3).
  # APP_VERSION must already match, or the build fails on purpose.
  push:
    tags: ['v*']

# Two releases building at once would race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # needed to push the bump commit, the tag, and the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # release notes are generated from history
          # Dispatch builds the tip of main (it is about to bump and tag it);
          # a tag push must build that exact tag, not whatever landed on main since.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not X.Y.Z"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Refuse to reuse an existing tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.v.outputs.tag }} already exists. Pick a new version."
            exit 1
          fi

      - name: Lint
        run: python tools/lint.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Bump APP_VERSION
        if: github.event_name == 'workflow_dispatch'
        # Working tree only. Nothing is pushed until the build has succeeded, so a
        # failed build leaves no bump commit and no dangling tag to clean up.
        run: python tools/bump_version.py "${{ steps.v.outputs.version }}"

      - name: Build app and installer
        env:
          QT_QPA_PLATFORM: offscreen
        # --expect-version is the guard that keeps a tag from shipping a build whose
        # APP_VERSION says something else. The updater compares those strings, so a
        # mismatch means users either never see the update or reinstall it forever.
        run: python tools/build_release.py --expect-version ${{ steps.v.outputs.version }}

      - name: Commit and tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "🚀 Release version ${{ steps.v.outputs.version }}"
            git push origin main
          fi
          # A tag pushed with GITHUB_TOKEN does not start another workflow run,
          # so this cannot trigger the push-tag path and double-publish.
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Package the portable build
        shell: pwsh
        run: Compress-Archive -Path dist/AutoDownloader/* -DestinationPath dist/AutoDownloader_Portable.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # The asset name matters: core/updater.py looks for an asset containing
        # "Setup" that ends in .exe, downloads it, and runs it with --silent.
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/AutoDownloader_Setup.exe \
            dist/AutoDownloader_Portable.zip \
            --title "Auto Episodes Downloader ${{ steps.v.outputs.version }}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}

      - name: Verify the updater can see the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Re-reads the published release exactly the way core/updater.py does, so a
        # broken asset name is caught here instead of by users who never get updates.
        run: |
          name=$(gh release view "${{ steps.v.outputs.tag }}" --json assets \
                 --jq '.assets[].name | select(test("Setup") and endswith(".exe"))')
          if [ -z "$name" ]; then
            echo "::error::No asset matches the updater's filter (name contains 'Setup', ends in '.exe')"
            exit 1
          fi
          echo "Updater will download: $name"

#===================================================
#mpv.net — INPUT CONFIG (anime + series, RTX 3050 / 1440p 300Hz)
#===================================================

#--- Fullscreen & Window ---
f           cycle fullscreen
F           cycle fullscreen
Alt+ENTER   cycle fullscreen

b           cycle border

#--- Playback Control ---
SPACE       cycle pause
p           cycle pause
RIGHT       seek 5
LEFT        seek -5
Shift+RIGHT  seek 60
Shift+LEFT  seek -60
Ctrl+RIGHT  seek 300           ; show-text "Seek +5 min"
Ctrl+LEFT   seek -300          ; show-text "Seek -5 min"
UP          add volume 5
DOWN        add volume -5
m           cycle mute
[           multiply speed 0.9091  ; show-text "Speed: ${speed}"
]           multiply speed 1.1     ; show-text "Speed: ${speed}"
{           multiply speed 0.5     ; show-text "Speed: ${speed}"
}           multiply speed 2.0     ; show-text "Speed: ${speed}"
BS          set speed 1.0          ; show-text "Speed: Normal"

#--- Chapter & Playlist ---
PGUP        add chapter 1
PGDWN       add chapter -1
<           playlist-prev
>           playlist-next
Shift+ENTER  playlist-next
ENTER       playlist-next ; show-text "Next video"

#--- Audio Controls ---
a           ignore
A           ignore
#cycle audio-delay      ; show-text "Audio delay: ${audio-delay}"
Ctrl+UP     add audio-delay 0.1    ; show-text "Audio delay +0.1s"
Ctrl+DOWN   add audio-delay -0.1   ; show-text "Audio delay -0.1s"

#--- Subtitle Controls ---
v           cycle sub
V           cycle sub down
z           add sub-delay -0.1     ; show-text "Sub delay: ${sub-delay}s"
x           add sub-delay +0.1     ; show-text "Sub delay: ${sub-delay}s"
Z           add sub-scale -0.1     ; show-text "Sub scale: ${sub-scale}"
X           add sub-scale +0.1     ; show-text "Sub scale: ${sub-scale}"
r           cycle-values sub-font-size 40 48 52 56 60 ; show-text "Sub size: ${sub-font-size}"
R           cycle-values sub-bold yes no ; show-text "Sub bold: ${sub-bold}"
t           cycle-values sub-pos 90 95 100 ; show-text "Sub position: ${sub-pos}"
u           cycle-values sub-ass-override yes no ; show-text "Sub override: ${sub-ass-override}"

#--- Screenshot ---
s           screenshot               ; show-text "Screenshot saved"
S           screenshot video         ; show-text "Screenshot (no subs) saved"
Ctrl+s      screenshot window        ; show-text "Window screenshot saved"
Alt+s       screenshot subtitles     ; show-text "Screenshot (subs only) saved"

#--- Stats & OSD ---
i           script-binding stats/display-stats
I           script-binding stats/display-stats-toggle
`           script-binding console/enable
TAB         script-binding osc/visibility ; show-text "OSC toggled"
o           cycle-values osd-level 3 1     ; show-text "OSD level: ${osd-level}"
O           no-osd cycle-values osd-level 3 1
d           cycle deinterlace              ; show-text "Deinterlace: ${deinterlace}"

#--- Video Adjustments ---
1           add contrast -1         ; show-text "Contrast: ${contrast}"
2           add contrast 1          ; show-text "Contrast: ${contrast}"
3           add brightness -1       ; show-text "Brightness: ${brightness}"
4           add brightness 1        ; show-text "Brightness: ${brightness}"
5           add gamma -1            ; show-text "Gamma: ${gamma}"
6           add gamma 1             ; show-text "Gamma: ${gamma}"
7           add saturation -1       ; show-text "Saturation: ${saturation}"
8           add saturation 1        ; show-text "Saturation: ${saturation}"
Alt+0       set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; show-text "Reset color adjustments"

#--- Mouse Wheel & Buttons ---
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
WHEEL_LEFT  seek -10
WHEEL_RIGHT  seek 10
MBTN_LEFT   cycle pause
MBTN_LEFT_DBL  cycle fullscreen
MBTN_FORWARD  apply-profile anime  ; show-text "Profile: ANIME MAX"
MBTN_BACK   apply-profile series     ; show-text "Profile: SERIES MAX"

#--- Shader compare ---
Ctrl+1      script-binding shader-compare-toggle






#--- Video Filters ---
Ctrl+d      cycle deband                           ; show-text "Deband: ${deband}"
Ctrl+i      cycle interpolation                     ; show-text "Interpolation: ${interpolation}"
Ctrl+h      cycle-values hwdec "auto" "no"         ; show-text "Hardware Decode: ${hwdec}"
Ctrl+t      cycle-values tone-mapping "bt.2446a" "spline" "bt.2390" "hable" ; show-text "Tone Mapping: ${tone-mapping}"

#--- Rotation & Flip ---
Alt+RIGHT   cycle-values video-rotate "0" "90" "180" "270" ; show-text "Rotation: ${video-rotate}°"
Alt+LEFT    cycle-values video-rotate "0" "270" "180" "90" ; show-text "Rotation: ${video-rotate}°"
Alt+UP      cycle video-unscaled                             ; show-text "Unscaled: ${video-unscaled}"
h           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" ; show-text "Aspect: ${video-aspect-override}"

#--- Show current shaders (which profile is active) ---
P           show-text "Active shaders:\n${glsl-shaders}" 5000

#--- Profile Switching ---
F1          apply-profile anime   ; show-text "Profile: ANIME MAX"
F2          apply-profile series  ; show-text "Profile: SERIES MAX"

#--- Loop & Playback ---
l           cycle-values loop-file "inf" "no" ; show-text "Loop file: ${loop-file}"
L           cycle-values loop-playlist "inf" "no" ; show-text "Loop playlist: ${loop-playlist}"
;           frame-step                 ; show-text "Frame: Step forward"
,           frame-back-step            ; show-text "Frame: Step back"

#--- Zoom & Pan (useful for cropping black bars) ---
Alt++       add video-zoom  0.1        ; show-text "Zoom: ${video-zoom}"
Alt+-       add video-zoom -0.1        ; show-text "Zoom: ${video-zoom}"
Alt+KP8     add video-pan-y -0.01      ; show-text "Pan Y: ${video-pan-y}"
Alt+KP2     add video-pan-y  0.01      ; show-text "Pan Y: ${video-pan-y}"
Alt+KP4     add video-pan-x -0.01      ; show-text "Pan X: ${video-pan-x}"
Alt+KP6     add video-pan-x  0.01      ; show-text "Pan X: ${video-pan-x}"
Alt+KP5     set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 ; show-text "Reset zoom/pan"

#--- System & Exit ---
q           quit
Q           quit-watch-later           ; show-text "Quit & save position"
ESC         quit
Ctrl+c      quit

#--- Experimental/Debug ---
F12         cycle-values video-sync "audio" "display-resample" ; show-text "Video sync: ${video-sync}"
Ctrl+r      seek 0 absolute            ; show-text "Restart video"






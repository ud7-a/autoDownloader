# =====================================================================
#  mpv.net — MAX QUALITY CONFIG (anime + series)
#  Installed by Auto Episodes Downloader. Your previous config was moved
#  to backup\<date>\ next to this file.
#  The anime chain uses Anime4K's largest models: it needs a high-end GPU.
#
#  Two profiles, picked automatically per file (see bottom):
#    [anime]  -> any file inside a folder named "animes"
#    [series] -> everything else
#  Manual override: F1 = anime, F2 = series. Ctrl+1 = shaders off/on.
# =====================================================================

# ---------- Video output / decoding ----------
vo=gpu-next
gpu-api=auto                    # vulkan or d3d11; vulkan is great on NVIDIA
gpu-context=auto
vulkan-async-transfer=yes
vulkan-async-compute=yes
hwdec=auto                      # nvdec; shaders work fine without -copy on gpu-next
hwdec-codecs=all

# ---------- Color (SDR) ----------
# Monitor in its normal (native wide-gamut) mode, NOT sRGB mode.
# Windows ICC profile (ASUS_Display_DisplayP3.icm) maps BT.709 onto the panel.
# target-prim/trc below are only a fallback when no ICC profile is found.
# NVIDIA Control Panel: Output color format RGB, dynamic range Full.
icc-profile-auto=yes
target-prim=bt.709
target-trc=gamma2.2
dither-depth=auto
dither=fruit
temporal-dither=yes

# ---------- HDR -> SDR tone mapping (HDR files only) ----------
target-colorspace-hint=no
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30      # restore highlight detail lost in tone mapping

# ---------- Motion ----------
# Even frame pacing: 23.976 fps on a 300 Hz screen is 12.5 refreshes per frame,
# so plain audio sync shows frames for 12 / 13 / 12 / 13 refreshes. Display sync
# with tscale=oversample shows every frame for the same time and only blends the
# one refresh where a frame changes -- no invented in-between frames (anime is
# drawn on 2s/3s, motion interpolation would warp the line art).
# Measured on the 300 Hz screen with the earlier, lighter anime chain: vsync
# jitter 0.000, 0 dropped / 0 mistimed frames in 20 s. Applies to every profile,
# but it needs GPU headroom: the current anime chain (UL models) on an RTX 3050
# dropped 60 frames in 20 s and stuttered, where audio sync played smoothly.
# scripts/sync-guard.lua handles that: when frames drop it switches that shader
# set to audio sync, and back when a lighter profile is picked -- so a fast GPU
# keeps smooth timing everywhere. F12 switches by hand.
video-sync=display-resample
interpolation=yes
tscale=oversample

# ---------- Audio ----------
audio-channels=stereo
audio-normalize-downmix=yes
audio-pitch-correction=yes
volume=100
volume-max=150

# ---------- Cache (streaming/network) ----------
cache=yes
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=60

# ---------- Subtitles ----------
sub-auto=fuzzy
sub-file-paths=ass:srt:sub:subs:subtitles
sub-font="Segoe UI"
sub-font-size=46
sub-color="#FFFFFFFF"
sub-border-color="#C8000000"
sub-border-size=2.6
sub-shadow-offset=1.2
sub-shadow-color="#40000000"
blend-subtitles=no              # subs rendered at screen res = crisp

# ---------- OSD / OSC ----------
osc=yes
osd-bar=yes
osd-font="Segoe UI"
osd-font-size=30
osd-duration=2000

# ---------- Screenshots ----------
screenshot-directory="~/Pictures/mpv_shots"
screenshot-format=png
screenshot-png-compression=7
screenshot-high-bit-depth=yes
screenshot-template="%F_%P_%04n"

# ---------- Window / playback ----------
fullscreen=yes
keep-open=yes
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
watch-later-options=start,vid,aid,sid
priority=high


# =====================================================================
#  PROFILES  (each sets its full state, so switching never leaks)
# =====================================================================

# ---- ANIME: Anime4K UL chain (best quality; needs a high-end GPU) ----
# Clamp_Highlights (anti-ring) -> Restore Soft UL (cleans compression without
# Restore UL's outline sharpening) -> Upscale x2 UL, ewa_lanczos down to the
# window in gamma light, no Thin (it reshapes the line art and burned-in
# subtitles). Was the F3 "compare" profile; it replaced the Large chain (Clamp +
# Restore Soft L + Upscale x2 L + Thin HQ, VMAF-NEG 97.29 on the test below).
# No KrigBilateral: on hard black lines it overshoots and paints blue / yellow /
# orange fringes beside them; mpv's ewa_lanczos chroma scaler was the most
# accurate of 7 tried (CfL and ArtCNN Chroma were worse on this source).
# Scored against a clean 17.5 Mbps release of the same episode (10 frames,
# 1080p WEB source -> 1440p; VMAF-NEG / SSIM / outline strength vs a faithful
# upscale / halo error / colour error on the lines, delta-E ab):
#   Krig + Restore UL, linear  98.15  .9699  130%  2.18  6.97
#   this                       98.51  .9766  119%  1.82  4.29
# Some green next to lines remains: it is in the source (13% of line pixels in
# the clean release, 12.5% here).
# Deliberately NOT here (measured): SSimDownscaler -- it mottles skies and halos
# lines and subtitles on 3 Mbps sources; and dropping Restore -- the upscaler
# then sharpens the compression noise.
# Cost: Restore Soft UL is the same size as Restore UL (25 passes), ~41 ms/frame
# on an RTX 3050 -- at the edge of 23.976 fps (41.7 ms); a fraction of that on
# a high-end GPU.
[anime]
profile-desc="Anime MAX — Anime4K UL (Clamp + Restore Soft UL + Upscale x2 UL)"
profile-cond=string.find(string.lower(path or ""), "[\\/]animes[\\/]") ~= nil
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_UL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_UL.glsl"
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=ewa_lanczos
linear-downscaling=no
correct-downscaling=yes
sigmoid-upscaling=yes
scale-antiring=0.7
cscale-antiring=0.7
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=0

# ---- SERIES: FSRCNNX 8 luma 2x -> ewa_robidoux down -> light adaptive-sharpen ----
# FSRCNNX is trained on real footage (anime CNNs make live action plastic).
# Lighter deband + more grain keeps real film grain intact.
# Scored on a live-action film (Tears of Steel, CC BY): a 4K-mastered 1080p
# copy as the reference, a web-quality encode of it (5.6 Mbps-at-1080p
# equivalent) played through each profile; 12 frames, 1.33x (1080p -> 1440p)
# and 2x (720p -> 1440p). NEG / SSIM / PSNR-Y / fine detail vs the original /
# halo error, at 1.33x | 2x:
#   old: FSRCNNX 16 + Krig + SSim + sharpen 1.0
#        98.32 .9381 33.9 dB 143% 5.02 | 98.08 .9329 33.6 dB 125% 5.49
#   this 98.97 .9652 36.9 dB  99% 3.72 | 98.60 .9511 35.3 dB  92% 4.50
# Sharpening 1.0 painted skin and foliage like oil paint; 0.2 brings detail
# back to the original's level (85% without it). FSRCNNX 8 matched 16;
# SSimDownscaler and KrigBilateral scored worse; ravu-zoom / ravu-lite /
# nnedi3 / ArtCNN / nlmeans were no better. Deband settings measured equal.
[series]
profile-desc="Series MAX — FSRCNNX 8 + adaptive-sharpen (light)"
profile-cond=string.find(string.lower(path or ""), "[\\/]animes[\\/]") == nil
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/adaptive-sharpen.glsl"
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=ewa_robidoux
linear-downscaling=no
correct-downscaling=yes
sigmoid-upscaling=yes
scale-antiring=0.7
cscale-antiring=0.7
deband=yes
deband-iterations=1
deband-threshold=32
deband-range=16
deband-grain=16
